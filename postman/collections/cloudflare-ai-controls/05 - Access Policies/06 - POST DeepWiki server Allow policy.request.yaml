$kind: http-request
name: 06 - POST DeepWiki server Allow policy
url: https://api.cloudflare.com/client/v4/accounts/{{cf_account}}/access/apps/{{deepwiki_access_app_id}}/policies
method: POST
body:
  type: json
  content: |-
    {
      "name": "Allow team access",
      "decision": "allow",
      "include": [
        { "email": { "email": "{{allow_email}}" } }
      ]
    }
order: 5006
