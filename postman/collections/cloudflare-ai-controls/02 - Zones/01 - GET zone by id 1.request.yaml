$kind: http-request
url: https://api.cloudflare.com/client/v4/zones/{{cf_zone_id1}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json && json.result && json.result.name) {
        pm.environment.set('portal_zone_id', pm.environment.get('cf_zone_id1'));
        console.log('Suggested portal_hostname: mcp.' + json.result.name);
      }
    language: text/javascript
examples: .resources/01 - GET zone by id 1.resources/examples
order: 2001
