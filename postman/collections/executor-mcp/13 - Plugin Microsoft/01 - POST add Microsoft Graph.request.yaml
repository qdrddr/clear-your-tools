$kind: http-request
name: 01 - POST add Microsoft Graph (mutating)
url: "{{base_url}}/api/microsoft/graph"
method: POST
body:
  type: json
  content: |
    {
      "presetIds": [
        "mail"
      ],
      "slug": "postman-msgraph"
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res && res.slug) pm.environment.set('integration_slug', res.slug);
    language: text/javascript
examples: .resources/01 - POST add Microsoft Graph.resources/examples
order: 2301
