$kind: http-request
url: "{{base_url}}/api/connections"
method: GET
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (Array.isArray(res) && res.length > 0) {
        var c = res[0];
        pm.environment.set('connection_owner', c.owner);
        pm.environment.set('connection_integration', c.integration);
        pm.environment.set('connection_name', c.name);
      }
    language: text/javascript
examples: .resources/01 - GET list connections.resources/examples
order: 1201
