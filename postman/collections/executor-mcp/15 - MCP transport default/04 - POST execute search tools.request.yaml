$kind: http-request
name: 04 - POST execute search tools
url: "{{base_url}}/mcp"
method: POST
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  mcp-session-id: "{{mcp_session_id}}"
body:
  type: json
  content: |
    {
      "jsonrpc": "2.0",
      "id": 3,
      "method": "tools/call",
      "params": {
        "name": "skills",
        "arguments": {
          "name": "execute"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      try {
        var payload = pm.response.json();
        var text = payload.result && payload.result.content && payload.result.content[0] && payload.result.content[0].text;
        if (text) pm.environment.set('execute_skill', text);
      } catch (e) {}
    language: text/javascript
examples: .resources/04 - POST execute search tools.resources/examples
order: 3004
