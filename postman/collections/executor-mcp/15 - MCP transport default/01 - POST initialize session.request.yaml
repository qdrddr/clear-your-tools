$kind: http-request
url: "{{base_url}}/mcp"
method: POST
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "jsonrpc": "2.0",
      "id": 1,
      "method": "initialize",
      "params": {
        "protocolVersion": "2025-03-26",
        "capabilities": {},
        "clientInfo": {
          "name": "postman-executor-mcp",
          "version": "1.0.0"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      var sessionId = pm.response.headers.get('mcp-session-id');
      if (sessionId) pm.environment.set('mcp_session_id', sessionId);
    language: text/javascript
examples: .resources/01 - POST initialize session.resources/examples
order: 3001
