$kind: http-request
description: |
  Configure 1Password plugin credentials. Set real `account` and `token` values;
  requests containing `REPLACE_ME` are skipped by the example sync harness.
name: 04 - PUT configure 1Password (mutating)
url: "{{base_url}}/api/onepassword/config"
method: PUT
body:
  type: json
  content: |
    {
      "authKind": "service-account",
      "account": "REPLACE_ME",
      "token": "REPLACE_ME"
    }
examples: .resources/04 - PUT configure 1Password.resources/examples
order: 2404
