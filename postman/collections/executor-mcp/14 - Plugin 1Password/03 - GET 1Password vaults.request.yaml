$kind: http-request
description: |
  Lists 1Password vaults for the configured service account.

  Requires real credentials: set `account` to your 1Password account subdomain
  and configure the service account token via the 1Password plugin settings.
  Requests with `REPLACE_ME` are skipped by the example sync harness.
url: "{{base_url}}/api/onepassword/vaults"
method: GET
queryParams:
  authKind: service-account
  account: REPLACE_ME
examples: .resources/03 - GET 1Password vaults.resources/examples
order: 2403
