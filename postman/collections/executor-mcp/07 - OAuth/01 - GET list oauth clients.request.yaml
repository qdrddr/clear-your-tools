$kind: http-request
url: "{{base_url}}/api/oauth/clients"
method: GET
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (Array.isArray(res) && res.length > 0) {
        pm.environment.set('oauth_client_slug', res[0].slug);
      }
    language: text/javascript
examples: .resources/01 - GET list oauth clients.resources/examples
order: 1601
