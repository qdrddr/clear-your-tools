$kind: http-request
url: "{{base_url}}/api/toolkits"
method: GET
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (!res.toolkits || res.toolkits.length === 0) return;
      var slug = pm.environment.get('toolkit_slug') || 'backend';
      var match = res.toolkits.find(function (t) { return t.slug === slug; });
      var toolkit = match || res.toolkits[0];
      pm.environment.set('toolkit_id', toolkit.id);
      pm.environment.set('toolkit_slug', toolkit.slug);
    language: text/javascript
examples: .resources/01 - GET list toolkits.resources/examples
order: 1701
