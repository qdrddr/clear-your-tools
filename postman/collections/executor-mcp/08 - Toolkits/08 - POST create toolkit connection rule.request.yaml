$kind: http-request
description: |
  Creates a connection allowlist rule (tool path pattern). Duplicate patterns
  return the existing rule (idempotent). Sets toolkit_connection_id for step 09.
url: "{{base_url}}/api/toolkits/{{toolkit_id}}/connections"
method: POST
body:
  type: json
  content: |
    {
      "pattern": "github.*"
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res && res.id) {
        pm.environment.set("toolkit_connection_id", res.id);
      }
    language: text/javascript
examples: .resources/08 - POST create toolkit connection rule.resources/examples
order: 1708
