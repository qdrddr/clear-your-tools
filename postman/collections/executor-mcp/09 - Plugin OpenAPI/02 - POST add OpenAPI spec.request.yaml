$kind: http-request
name: 02 - POST add OpenAPI spec (mutating)
url: "{{base_url}}/api/openapi/specs"
method: POST
body:
  type: json
  content: |
    {
      "slug": "postman-ping-{{postman_run_id}}",
      "spec": {
        "kind": "url",
        "url": "https://learn.openapis.org/examples/v3.0/petstore.json"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res && res.slug) pm.environment.set('integration_slug', res.slug);
    language: text/javascript
examples: .resources/02 - POST add OpenAPI spec.resources/examples
order: 1902
