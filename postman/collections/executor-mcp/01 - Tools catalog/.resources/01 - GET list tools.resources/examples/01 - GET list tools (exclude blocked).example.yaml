        {
          "address": "tools.gitnexus.org.default.api_impact",
          "owner": "org",
          "integration": "gitnexus",
          "connection": "default",
          "name": "api_impact",
          "pluginId": "mcp",
          "description": "Pre-change impact report for an API route handler.\n\nWHEN TO USE: BEFORE modifying any API route handler. Shows what consumers depend on, what response fields they access, what middleware protects the route, and what execution flows it triggers. Requires at least \"route\" or \"file\" parameter.\n\nRisk levels: LOW (0-3 consumers), MEDIUM (4-9 or any mismatches), HIGH (10+ consumers or mismatches with 4+ consumers). Mismatches with confidence \"low\" indicate the consumer file fetches multiple routes — property attribution is approximate.\n\nResponse shape is keyed on how many routes match, not on the data: exactly one match returns a single route object; two or more return { routes: [...], total: N }. The same URL can expose multiple HTTP verbs (e.g. GET and POST /api/orders are distinct routes that share the URL), so a bare-URL lookup may return the wrapped form — every route object carries its own \"method\" so verbs are distinguishable. Pass \"method\" to narrow to one verb; the single-object shape is returned only when exactly one route remains after filtering — a substring route/file match spanning several URLs can still return the wrapped form. A URL/file that exists but has no route for the given verb returns an error. Each route's \"method\" is the literal \"*\" for method-agnostic routes (e.g. Django function views), which match any \"method\" selector, or null for method-less routes (filesystem, Laravel resource), which never match a selector. Combines route_map, shape_check, and impact data.",
          "mayElicit": null,
          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
