          "connection": "default",
          "name": "check",
          "pluginId": "mcp",
          "description": "Run read-only structural checks against the indexed graph.\n\nCurrently detects directed cycles between File nodes connected by IMPORTS edges.\nReturns deterministic cycle paths and a cycle count suitable for CI automation.",
