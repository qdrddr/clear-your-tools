          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
        },
        {
          "address": "tools.gitnexus.org.default.context",
          "owner": "org",
          "integration": "gitnexus",
          "connection": "default",
          "name": "context",
          "pluginId": "mcp",
          "description": "360-degree view of a single code symbol.\nShows categorized incoming/outgoing references (calls, imports, extends, implements, methods, properties, overrides), process participation, and file location.\n\nWHEN TO USE: After query() to understand a specific symbol in depth. When you need to know all callers, callees, and what execution flows a symbol participates in.\nAFTER THIS: Use impact() if planning changes, or READ gitnexus://repo/{name}/process/{processName} for full execution trace.\n\nHandles disambiguation: if multiple symbols share the same name, returns ranked candidates (each with a relevance score) for you to pick from. Use uid for zero-ambiguity lookup, or narrow the search with file_path and/or kind hints.\n\nNOTE: ACCESSES edges (field read/write tracking) are included in context results with reason 'read' or 'write'. CALLS edges resolve through field access chains and method-call chains (e.g., user.address.getCity().save() produces CALLS edges at each step).\n\nGROUP MODE: set \"repo\" to \"@<groupName>\" to run context in each member repo (aggregated list), or \"@<groupName>/<groupRepoPath>\" for one member. If you use \"@<groupName>\" only, the member defaults to the lexicographically first key in group.yaml \"repos\".\n\nSERVICE: optional monorepo path prefix (case-sensitive path segments). When \"repo\" starts with \"@\", prefix-matches resolved symbol file paths; when a hit is outside the prefix, that member returns an empty payload for the symbol. Ignored for a normal indexed repo name.",
          "mayElicit": null,
          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
