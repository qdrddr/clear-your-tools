          "integration": "code_review_graph_mcp",
          "connection": "localcodereviewgraph",
          "name": "cross_repo_search_tool",
          "pluginId": "mcp",
          "description": "Search for code entities across all registered repositories.\n\nRuns hybrid search on each registered repo's graph database and merges\nthe results by score. Register repos first with the CLI 'register' command.",
          "mayElicit": null,
          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
        },
        {
          "address": "tools.code_review_graph_mcp.org.localcodereviewgraph.detect_changes_tool",
          "owner": "org",
          "integration": "code_review_graph_mcp",
          "connection": "localcodereviewgraph",
          "name": "detect_changes_tool",
          "pluginId": "mcp",
          "description": "Detect changes and produce risk-scored, priority-ordered review guidance.\n\nPrimary tool for code review. Maps git diffs to affected functions,\nflows, communities, and test coverage gaps. Returns risk scores and\nprioritized review items. Replaces get_review_context for change-aware reviews.\n\nOffloaded to a thread via ``asyncio.to_thread`` — runs `git diff`\nsubprocesses and BFS traversals that can take several seconds on\nlarge repos. See: #46, #136.",
          "mayElicit": null,
          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
        },
        {
          "address": "tools.code_review_graph_mcp.org.localcodereviewgraph.embed_graph_tool",
          "owner": "org",
          "integration": "code_review_graph_mcp",
          "connection": "localcodereviewgraph",
          "name": "embed_graph_tool",
          "pluginId": "mcp",
          "description": "Compute vector embeddings for all graph nodes to enable semantic search.\n\nRequires: pip install code-review-graph[embeddings] (local provider only;\ncloud providers use stdlib urllib).\nDefault provider: local. Default model: all-MiniLM-L6-v2.\nOverride provider via `provider` param, model via `model` param or\nCRG_EMBEDDING_MODEL / CRG_OPENAI_MODEL env vars.\nChanging the model or provider re-embeds all nodes automatically.\n\nAfter running this, semantic_search_nodes_tool will use vector similarity\ninstead of keyword matching for much better results.\n\nRuns the blocking sentence-transformers / Gemini / HTTP inference in a\nthread via ``asyncio.to_thread`` so the stdio event loop stays\nresponsive — without this wrapper, embedding a large graph would\nsilently hang the MCP server on Windows. See: #46, #136.",
          "mayElicit": null,
          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
        },
        {
          "address": "tools.code_review_graph_mcp.org.localcodereviewgraph.find_large_functions_tool",
          "owner": "org",
          "integration": "code_review_graph_mcp",
          "connection": "localcodereviewgraph",
          "name": "find_large_functions_tool",
          "pluginId": "mcp",
          "description": "Find functions, classes, or files exceeding a line-count threshold.\n\nUseful for decomposition audits, code quality checks, and enforcing\nsize limits during code review. Results are ordered by line count.",
          "mayElicit": null,
          "requiresApproval": false,
          "approvalDescription": null,
          "static": null
        },
        {
          "address": "tools.code_review_graph_mcp.org.localcodereviewgraph.generate_wiki_tool",
          "owner": "org",
