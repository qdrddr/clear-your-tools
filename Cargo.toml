[workspace]
members = ["sdk/rust/cyt-indexer"]
exclude = ["chunk-your-tools"]
resolver = "2"

# Rust release strip=debuginfo can misalign LC_SYMTAB.stroff; macOS 27+ dyld rejects
# such Mach-O dylibs at load time (rust-lang/rust#157750). Applies to Python/C/Go/TS SDKs.
[profile.release]
strip = false

[patch.crates-io]
chunk-your-skills = { path = "chunk-your-skills-v2.1.9" }
chunk-your-tools = { path = "chunk-your-tools-v2.3.9" }
