# Workspace cargo-deny policy (Apache-2.0 cyt-indexer + common Rust deps).
# MPL-2.0 is allowed here for build-only crates (e.g. cbindgen) and dual-licensed
# runtime deps where a permissive option applies (e.g. htmlescape via tantivy).
# Distributed policy: see legal/POLICY.md (permissive licenses only in release artifacts).

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
