# FOSSA cloud scanner: production / distributed deps only (see legal/POLICY.md).
#
# Quick Import static scans cannot exclude individual files (paths.exclude is directory-only;
# see https://github.com/fossas/fossa-cli/issues/968). Mitigations for cloud + local CLI:
#   1. dev-requirements.txt — not matched by setuptools requirements*.txt glob at repo root
#   2. fossa-deps.yml — explicit Python production graph (from requirements.txt)
#   3. targets.only — scan cargo, Go SDK, TS SDK only; Python via fossa-deps.yml (no uv/setuptools@./)

version: 3

paths:
  exclude:
    - uv.lock
    - "**/uv.lock"
    - "**/dev-requirements.txt"
    - "**/scripts/deps/output/**"
    - "**/scripts/legal/output/**"
    - target/**
    - .uv-cache/**
    - chunk-your-*/**
    - sdk/e2e/**

targets:
  only:
    - type: cargo
      path: .
    - type: gomod
      path: sdk/go
    - type: npm
      path: sdk/typescript
