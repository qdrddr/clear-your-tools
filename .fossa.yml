# FOSSA: scan production Python deps only (see legal/POLICY.md).
# paths.exclude prunes directories; uv/setuptools targets are narrowed in targets.exclude.
# Production Python graph comes from fossa-deps.yml (generated from requirements.txt).

version: 3

paths:
  exclude:
    - uv.lock
    - "**/uv.lock"
    - "**/requirements-dev.txt"
    - "**/scripts/deps/output/**"
    - target/**
    - .uv-cache/**
    - chunk-your-*/**
    - sdk/e2e/**

targets:
  exclude:
    # uv.lock carries dev/test groups; production Python deps are in fossa-deps.yml.
    - type: uv
    # setuptools globs all requirements*.txt at repo root; cannot exclude files via paths.
    - type: setuptools
      path: .
    # Root package.json is repo CI tooling (fallow, typescript); published npm is sdk/typescript.
    - type: npm
      path: .
