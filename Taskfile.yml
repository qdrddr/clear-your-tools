# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dir: "{{.TASKFILE_DIR}}"

vars:
  PYTHON_VERSION: "3.13"

env:
  PATH: "{{.ROOT_DIR}}/.venv/bin:{{.PATH}}"

tasks:
  sync:
    desc: Install/sync Python dependencies with uv
    cmds:
      - uv sync --all-extras --group dev --group test --locked

  check:
    desc: Run ty type checker
    cmds:
      - uv run ty check src/ --project . --output-format=concise

  ruff:
    desc: Lint with auto-fix
    cmds:
      - uv run ruff check --fix src/cyt src/tests sdk/python

  ruff-check:
    desc: Lint without auto-fix (CI mode)
    cmds:
      - uv run ruff check src/cyt src/tests sdk/python

  format:
    desc: Format code
    cmds:
      - uv run ruff format src/cyt src/tests sdk/python

  format-check:
    desc: Check formatting (CI mode)
    cmds:
      - uv run ruff format --check src/cyt src/tests sdk/python

  mypy:
    desc: Run mypy static analysis
    cmds:
      - uv run mypy -p cyt

  pytest:
    desc: Run tests
    cmds:
      - uv run pytest src/tests

  ast-test:
    desc: Test ast-grep lint rules
    cmds:
      - ast-grep test --skip-snapshot-tests

  ast-scan:
    desc: Pattern-based security/quality scan
    cmds:
      - ast-grep scan src/ sdk/

  right:
    desc: Run BasedPyright static analysis
    cmds:
      - basedpyright src sdk/python

  build:
    desc: Build Python package wheel/sdist
    cmds:
      - uv build

  verify-sdk:
    desc: Verify cyt-indexer-sdk native import
    cmds:
      - uv run python -c "from cyt_indexer._native import count_tokens; assert count_tokens('hello') > 0"

  prek:
    desc: Run Python pre-commit hooks
    cmds:
      - uv run prek run ty-check mypy pytest basedpyright ruff ruff-format --all-files

  ci:
    desc: Mirror CI Python checks
    cmds:
      - task: sync
      - task: verify-sdk
      - task: ruff-check
      - task: format-check
      - task: mypy
      - task: pytest
      - task: build

  all-tests:
    desc: Run all checks, continue on failure
    cmds:
      - task: check
        ignore_error: true
      - task: ruff
        ignore_error: true
      - task: format
        ignore_error: true
      - task: mypy
        ignore_error: true
      - task: pytest
        ignore_error: true
      - task: ast-scan
        ignore_error: true
      - task: right
        ignore_error: true

  all-seq:
    desc: Run all checks sequentially, stop on failure
    cmds:
      - task: check
      - task: ruff
      - task: format
      - task: mypy
      - task: pytest
      - task: ast-scan
      - task: right
