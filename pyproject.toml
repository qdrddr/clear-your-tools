[project]
name = "clear-your-tools"
version = "2.14.2"
description = "Clear Your Tools (CYT) — dynamic tool gating for eliminating the MCP/tools tax"

keywords = ["Clear Your Tools", "CYT", "mcp", "mcp-client", "tool-gating"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Damien Berezenko" },
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "cyt-indexer-sdk==2.14.2",
    "pydantic==2.12.5",
    "typing_extensions==4.15.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "keyring==25.6.0",
    "uuid7==0.1.0",
    "zipp==4.1.0",
]

[project.urls]
Homepage = "https://github.com/qdrddr/clear-your-tools"
Repository = "https://github.com/qdrddr/clear-your-tools"
Issues = "https://github.com/qdrddr/clear-your-tools/issues"
PyPI = "https://pypi.org/project/clear-your-tools/"
LinkedIn = "https://www.linkedin.com/in/damien-e"

[project.optional-dependencies]
claude = []
codex = []
cursor = []
agents = ["clear-your-tools[claude,codex,cursor]"]
proxy = [
    "httpx==0.28.1",
    "uvicorn==0.48.0",
    "starlette==1.3.1",
    "hypercorn==0.18.0",
    "h2==4.4.1",
]
pruners = [
    "litellm==1.94.0",
]
cyt-mcp = [
    "cyt-indexer-sdk==2.14.2",
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "uvicorn==0.48.0",
    "starlette==1.3.1",
    "pyyaml==6.0.3",
]
all = [
    "clear-your-tools[agents,proxy,pruners,cyt-mcp]",
]

[project.scripts]
cyt = "cyt.proxy.cli_impl:main"
cyt-client = "cyt_client.cli:main"
cyt-rerank = "cyt.pruners.rerank:main"
cyt-llm-prune = "cyt.pruners.llm:main"
cyt-bm25-prune = "cyt.pruners.bm25:main"
cyt-mcp = "cyt_mcp.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyt", "src/cyt_core", "src/cyt_client", "src/cyt_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
  "/src/cyt",
  "/src/cyt_core",
  "/src/cyt_client",
  "/src/cyt_mcp",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
]
skip-excluded-dirs = true
exclude = [
  "/.cursorignore",
  "/.git",
  "/.gitnexus",
  "/.uv-cache",
  "/target",
  "/.build",
  "/.go-cache",
  "/.cargo-home",
  "/chunk-your-tools",
  "/sdk",
  "/src/nogo",
  "/src/old",
  "/anthropic.log.1",
  "/examples/go-git-smoke/.staging",
  "/examples/go-git-smoke/cyt-go-git-smoke",
]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "NOTICE"
"src/cyt/config/defaults.yaml" = "cyt/config/defaults.yaml"
"src/cyt/py.typed" = "cyt/py.typed"
"src/cyt_core/py.typed" = "cyt_core/py.typed"
"src/cyt_client/py.typed" = "cyt_client/py.typed"
"src/cyt_mcp/py.typed" = "cyt_mcp/py.typed"
"src/cyt/executor/py.typed" = "cyt/executor/py.typed"
"src/cyt/mcpc/py.typed" = "cyt/mcpc/py.typed"

[dependency-groups]
# Development tools (linters, type-checkers) and utilities
dev = [
    "prek==0.4.3",
    "cpplint==2.0.2",
    "click==8.3.3",
    "detect-secrets==1.5.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-dependency==0.6.1",
    "pytest-durations==1.6.2",
    "pytest-xdist==3.8.0",
    "python-semantic-release==10.6.1",
    "mypy==2.1.0",
    "ruff==0.15.14",
    "setuptools==83.0.0",
    "types-psutil==7.2.2.20260518",
    "ty==0.0.74",
    "basedpyright==1.39.6",
    "ast-grep-cli==0.41.0",
]

# Test stack and utilities
test = [
    "aiohttp==3.14.3",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "pytest-asyncio==1.4.0",
    "mypy==2.1.0",
    "httpx==0.28.1",
    "uvicorn==0.48.0",
    "starlette==1.3.1",
    "hypercorn==0.18.0",
    "h2==4.4.1",
    "uuid7==0.1.0",
    "litellm==1.94.0",
    "fastmcp==3.4.5",
    "pytest-bdd==8.1.0",
    "gherkin-official==40.0.0",
]

[tool.uv]
package = true
default-groups = ["dev", "test"]
override-dependencies = [
    "gherkin-official==40.0.0",
    # Snyk: SNYK-PYTHON-GITPYTHON-* (command injection, arg injection, secret leak, config injection)
    "gitpython==3.1.57",
    # Snyk: SNYK-PYTHON-URLLIB3-* (proxy auth leak, open redirect)
    "urllib3==2.7.0",
    # Snyk: SNYK-PYTHON-REQUESTS-* (verify bypass, .netrc leak, insecure temp file)
    "requests==2.34.2",
    # Snyk: SNYK-PYTHON-IDNA-16769942 (ReDoS)
    "idna==3.18",
    # Snyk: SNYK-PYTHON-ZIPP-7430899 (infinite loop)
    "zipp==4.1.0",
    # Snyk: SNYK-PYTHON-SETUPTOOLS-* (ReDoS, code injection, directory traversal)
    "setuptools==83.0.0",
    # Snyk: SNYK-PYTHON-CRYPTOGRAPHY-* (security fixes in 50.x)
    "cryptography==50.0.0",
]

[tool.uv.sources]
cyt-indexer-sdk = { path = "sdk/python", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100
respect-gitignore = true

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "C90",  # mccabe (complexity)
  "ANN",  # flake8-annotations
  "PD",   # pandas-vet
  "PIE",  # flake8-pie
  "Q",    # flake8-quotes
  "RUF",  # Ruff-specific checks
  "ASYNC" # async
]
ignore = [
  # "C408",   # Unnecessary `dict()` call (rewrite as a literal)
  "E501",   # Line too long, handled by ruff formatter
  # "D107",   # "Missing docstring in __init__",
  # "F401",   # imported but unused; consider using `importlib.util.find_spec` to test for "
  # "F811",   # "redefinition of the same function"
  # "PL",     # Pylint
  # "RUF012", # Mutable Class Attributes
  # "UP006",  # List vs list, etc
  # "UP007",  # Option and Union
  # "UP035",  # `typing.Set` is deprecated, use `set` instead"
  # "A005",   # Module `code` shadows a Python standard-library module
  # "ANN101",  # Missing type annotation for self
  # "ANN102",  # Missing type annotation for cls
  # "ANN401",  # Dynamically typed expressions (Any)
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  # Allow Pydantic's `@validator` decorator to trigger class method treatment.
  "pydantic.validator",
]

[tool.ty.environment]
root = ["./src"]
extra-paths = ["./typings"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "${config_dir}/src:${config_dir}/typings"
pretty = true
python_version = "3.13"
no_implicit_optional = true
exclude = ["^site/", "^nogo/", "^src/nogo/", "^docs/", "^src/catalog/", "^cocoindex-code/"]
plugins = "pydantic.mypy"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "rich.*",
    "yaml.*",
    "pandas.*",
    "litellm.*",
    "fastmcp.*",
    "google.*",
    "uuid_extensions.*",
    "cyt_indexer.*",
]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
failOnWarnings = false
include = ["src/cyt", "count_request_tokens.py"]
stubPath = "typings"
exclude = ["**/nogo/**", "src/old/**", "src/catalog/**"]
executionEnvironments = [
  { root = "src", extraPaths = ["src", "typings"] },
  { root = ".", extraPaths = ["src", "typings"] },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
    "integration: tests that call real external APIs (manual only: pytest -m integration --run-integration)",
    "runtime: tests that may spawn cyt hook daemon or cyt launch proxy (manual only: pytest -m runtime --run-runtime)",
    "gherkin: BDD scenarios (pytest-bdd; see src/tests/unit/gherkin and src/tests/integration/gherkin)",
    "qa: manual harness scripts under src/tests/qa/",
    "quality_metrics: architectural gates and metrics validation under src/tests/quality_metrics/",
]
filterwarnings = [
    "error",
    # Ignore ResourceWarnings from unclosed sockets/event loops
    "ignore::ResourceWarning",
    # cyt deprecation shim auto-bootstraps on import during migration
    "ignore:Importing cyt runs bootstrap:DeprecationWarning",
    # Ignore warnings from external dependencies
    "ignore:.*Use BaseMetaSerializer.*:DeprecationWarning",
    "ignore:.*Using `@model_validator` with mode='after' on a classmethod is deprecated.*:pydantic.warnings.PydanticDeprecatedSince212",
]
addopts = "-q -m 'not integration and not qa and not runtime'"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/cyt"]
omit = ["src/tests/*", "src/old/*", "src/nogo/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.codespell]
skip = "sdk/typescript/package-lock.json,postman/**,sdk/rust/cyt-indexer/cyt-indexer.cdx.json,sdk/rust/cyt-indexer/cyt-indexer.snyk.json"
ignore-words-list = [
    "fallow",
    "Bui",
    "te",
    "Provices",
]
