defaults:
  is_persistent: true
  embedding_model_type: remote
  embedding_model_nick: embed-qwen3-8b
  reranking_model_type: remote
  reranking_model_nick: rerank-qwen3-8b
  reranking_enabled: true
  intent_router:
    top_k: 10
    threshold: 0.28
models:
  embeddings:
    inprocess:
      - name: sentence-transformers/all-MiniLM-L6-v2
        nick: all-MiniLM-L6-v2
    remote:
      - name: qwen/qwen3-embedding-8b
        provider: openrouter
        nick: embed-qwen3-8b
        key_var_name: OPENROUTER_API_KEY
        #base_url: https://openrouter.ai/api/v1
      - name: all-minilm:33m
        provider: ollama
        nick: all-minilm
        #key_var_name: OPENROUTER_API_KEY
        #base_url: http://localhost:11434
  rerankers:
    remote:
      - name: Qwen/Qwen3-Reranker-8B
        provider: deepinfra
        nick: rerank-qwen3-8b
        key_var_name: DEEPINFRA_API_KEY
        #base_url: https://api.deepinfra.com/v1
vectordb:
  dir: .chroma_db