[package]
name = "cyt-indexer"
version = "0.2.8"
edition = "2024"
authors = ["Damien Berezenko"]
description = "Tool schema decomposition and catalog indexing for MCP tool gating"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/qdrddr/clear-your-tools"
keywords = ["mcp", "json-schema", "tool-gating"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cyt_indexer"
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli"]
cli = []
python = ["pyo3"]
node = ["napi", "napi-derive"]

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py312"], optional = true }
napi = { version = "3", features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true, features = ["type-def"] }

[build-dependencies]
napi-build = "2"

[[bin]]
name = "cyt-indexer"
path = "src/bin/cyt-indexer.rs"
required-features = ["cli"]
