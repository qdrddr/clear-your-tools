[package]
name = "cyt-indexer"
version = "2.8.3"
edition = "2024"
authors = ["Damien Berezenko"]
description = "Tool schema decomposition and catalog indexing for MCP tool gating"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/qdrddr/clear-your-tools"
keywords = ["mcp", "json-schema", "tool-gating"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cyt_indexer"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["cli"]
cli = []
testing = []
python = ["pyo3", "pythonize"]
node = ["napi", "napi-derive"]
ffi = []

[dependencies]
chunk-your-tools = "2.3.4"
chunk-your-skills = "2.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chunk = { version = "0.10", default-features = false }
rust-stemmers = "1.2"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
pythonize = { version = "0.29", optional = true }
napi = { version = "3", features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true, features = ["type-def"] }
tiktoken-rs = "0.12"
tantivy = "0.26"
sha2 = "0.11.0"
hex = "0.4.3"

[build-dependencies]
napi-build = "2"
cbindgen = "0.29"

[dev-dependencies]
cucumber = "0.21"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[bin]]
name = "cyt-indexer"
path = "src/bin/cyt-indexer.rs"
required-features = ["cli"]

[[test]]
name = "ffi_smoke"
path = "tests/ffi/smoke.rs"
required-features = ["ffi"]

[[test]]
name = "ffi_policies"
path = "tests/ffi/policies.rs"
required-features = ["ffi"]

[[test]]
name = "ffi_pipeline"
