# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dir: "{{.TASKFILE_DIR}}"

vars:
  REPO_ROOT:
    sh: cd "{{.TASKFILE_DIR}}/../.." && pwd

tasks:
  install:
    desc: Install npm dependencies
    cmds:
      - npm ci

  test:
    desc: Run tests
    cmds:
      - npm test

  tsc:
    desc: Typecheck without emit
    cmds:
      - npx tsc --noEmit -p .

  build:
    desc: Build native + JS artifacts
    cmds:
      - npm run build

  audit:
    desc: npm audit (high severity and above)
    cmds:
      - npm audit --audit-level=high

  sort-package-json:
    desc: Sort package.json keys
    cmds:
      - npx --yes sort-package-json package.json

  ast-scan:
    desc: Pattern-based security/quality scan
    dir: "{{.REPO_ROOT}}"
    cmds:
      - ast-grep scan sdk/typescript --globs "!sdk/typescript/src/test/**"

  prek:
    desc: Run TypeScript SDK pre-commit hooks
    dir: "{{.REPO_ROOT}}"
    cmds:
      - uv run prek run typescript-typecheck typescript-test typescript-npm-audit typescript-sort-package-json typescript-ast-scan --all-files

  dupes:
    cmds:
      - fallow dupes
  health:
    cmds:
      - fallow health
  fallow-auto:
    cmds:
      - fallow fix
  #      - fallow fix --dry-run        # Preview automatic cleanup

  all-tests:
    desc: Run all checks, continue on failure
    cmds:
      - task: tsc
        ignore_error: true
      - task: test
        ignore_error: true
      - task: build
        ignore_error: true
      - task: audit
        ignore_error: true
      - task: ast-scan
        ignore_error: true

  all-seq:
    desc: Run all checks sequentially, stop on failure
    cmds:
      - task: tsc
      - task: test
      - task: build
      - task: audit
      - task: ast-scan
