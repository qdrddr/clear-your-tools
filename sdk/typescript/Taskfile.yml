# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  prek:
    desc: Run all pre-commits
    cmds:
      - prek run --all-files

  check-json:
    desc: Check JSON FILES
    cmds:
      - prek run check-json --all-files

  ui:
    cmds:
      - npm run dev

  test:
    desc: Run tests
    cmds:
      - npm test -- --run

  tsc:
    desc: Run tests
    cmds:
      - npx tsc --noEmit -p .

  build:
    cmds:
      - npm run build

  ast-scan:
    desc: Pattern-based security/quality scan
    cmds:
      - uv run ast-grep scan app/

  preview:
    cmds:
      - npm run preview

  lint:
    cmds:
      - npm run lint

  dead-code:
    cmds:
      - fallow dead-code

  dupes:
    cmds:
      - fallow dupes

  health:
    cmds:
      - fallow health

  fallow-auto:
    cmds:
      - fallow fix
  #      - fallow fix --dry-run        # Preview automatic cleanup

  backlog:
    desc: Open backlog browser (requires npm install -g backlog.md)
    cmds:
      - backlog browser

  all-tests:
    desc: Run all checks, continue on failure
    cmds:
      - task: prek
        ignore_error: true
      - task: test
        ignore_error: true
      - task: build
        ignore_error: true
      - task: lint
        ignore_error: true
  #      - task: ast-scan
  #        ignore_error: true

  all-seq:
    desc: Run all checks sequentially, stop on failure
    cmds:
      - task: prek
      - task: test
      - task: build
      - task: lint
