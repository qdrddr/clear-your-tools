[project]
name = "cyt-indexer-sdk"
version = "2.11.3"
description = "Python SDK for cyt-indexer — tool schema decomposition and catalog indexing"
requires-python = ">=3.13,<4.0"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Damien Berezenko" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/qdrddr/clear-your-tools/tree/main/sdk/python"
Repository = "https://github.com/qdrddr/clear-your-tools"
Documentation = "https://github.com/qdrddr/clear-your-tools/tree/main/sdk/python"
PyPI = "https://pypi.org/project/cyt-indexer-sdk/"

[build-system]
requires = ["maturin==1.13.3"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../rust/cyt-indexer/Cargo.toml"
features = ["python"]
module-name = "cyt_indexer._native"
python-source = "src"
include = ["NOTICE", "LICENSE"]

[dependency-groups]
dev = [
    "cffi==2.0.0",
    "maturin==1.13.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
