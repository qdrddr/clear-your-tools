# Publish cyt-indexer to crates.io when a GitHub Release is published.
#
# One-time setup (repository maintainer with admin access):
#
# 1. crates.io — create API token at https://crates.io/settings/tokens
#
# 2. GitHub — Environment (Settings → Environments → New environment):
#    - Name: crates
#    - Secret: CARGO_REGISTRY_TOKEN (crates.io API token)
#    - Optional: required reviewers, wait timer, deployment branch rule (main only)
#
# 3. Create a release to trigger this workflow.
#    Tag must end with a semver (e.g. cyt-indexer-rust-v0.1.2 → publishes 0.1.2).

name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.1.0); leave empty to use release tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-crate:
    name: Upload cyt-indexer to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/cyt-indexer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        working-directory: sdk/rust/cyt-indexer
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Strip any prefix; keep semver from the end of the tag (…-v0.1.2 or …-0.1.2).
          if [[ "$TAG" =~ v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not parse semver from release tag: ${TAG}"
            exit 1
          fi
          echo "Setting cyt-indexer version to ${VERSION} (from tag ${TAG})"
          cargo set-version "$VERSION"

      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        working-directory: sdk/rust/cyt-indexer
        run: cargo set-version "${{ inputs.version }}"

      - name: Test crate
        run: cargo test -p cyt-indexer

      - name: Publish to crates.io
        working-directory: sdk/rust/cyt-indexer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
