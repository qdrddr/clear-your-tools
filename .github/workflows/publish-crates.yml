# Publish cyt-indexer to crates.io when a version tag is pushed or a GitHub Release is published.
#
# One-time setup (repository maintainer with admin access):
#
# 1. crates.io — Trusted Publisher (https://crates.io/crates/cyt-indexer/settings/publishing):
#    - Crate: cyt-indexer (must have at least one manual publish first)
#    - Owner: qdrddr
#    - Repository: clear-your-tools
#    - Workflow: publish-crates.yml
#    - Environment name: crates
#
# 2. GitHub — Environment (Settings → Environments → New environment):
#    - Name: crates
#    - Optional: required reviewers, wait timer, deployment branch rule (main only)
#    - No secrets needed when using crates.io trusted publishing (OIDC)
#
# 3. Push a semver tag or publish a GitHub Release with that tag.
#    Examples: v0.2.0, cyt-indexer-rust-v0.1.2 (semver is parsed from the tag).
#
# See RFC 3691: https://rust-lang.github.io/rfcs/3691-trusted-publishing-cratesio.html

name: 1. Publish cyt-indexer to crates.io

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-crate:
    name: Upload cyt-indexer to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/cyt-indexer
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from tag
        if: github.event_name == 'release' || github.event_name == 'push'
        shell: bash
        working-directory: sdk/rust/cyt-indexer
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # Strip any prefix; keep semver from the end of the tag (…-v0.1.2 or …-0.1.2).
          if [[ "$TAG" =~ v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not parse semver from tag: ${TAG}"
            exit 1
          fi
          echo "Setting cyt-indexer version to ${VERSION} (from tag ${TAG})"
          cargo set-version "$VERSION"

      - name: Test crate
        run: cargo test -p cyt-indexer

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        working-directory: sdk/rust/cyt-indexer
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
