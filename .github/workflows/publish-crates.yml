# Publish cyt-indexer to crates.io when a GitHub Release is published.
#
# One-time setup (repository maintainer):
#
# 1. crates.io — create API token at https://crates.io/settings/tokens
# 2. GitHub — Environment `crates` with secret CARGO_REGISTRY_TOKEN
# 3. Create a release (tag e.g. v0.1.0) to trigger this workflow.
#    Version is taken from the tag (without leading "v") via cargo set-version.

name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.1.0); leave empty to use release tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-crate:
    name: Upload cyt-indexer to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/cyt-indexer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Set version from release tag
        if: github.event_name == 'release'
        working-directory: sdk/rust/cyt-indexer
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          cargo set-version "$VERSION"

      - name: Set version from workflow input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        working-directory: sdk/rust/cyt-indexer
        run: cargo set-version "${{ inputs.version }}"

      - name: Test crate
        run: cargo test -p cyt-indexer

      - name: Publish to crates.io
        working-directory: sdk/rust/cyt-indexer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
