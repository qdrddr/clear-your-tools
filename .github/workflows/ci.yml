name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --group dev --group test --frozen

      - name: Ruff lint
        run: uv run ruff check src/cyt src/tests

      - name: Ruff format
        run: uv run ruff format --check src/cyt src/tests

      - name: Mypy
        run: uv run mypy src/cyt

      - name: Pytest
        run: uv run pytest src/tests

      - name: Build package
        run: uv build
