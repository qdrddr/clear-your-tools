name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --all-extras --group dev --group test --locked

      - name: Verify cyt-indexer-sdk import
        run: uv run python -c "from cyt_indexer._native import count_tokens; assert count_tokens('hello') > 0"

      - name: Ruff lint
        run: uv run ruff check src/cyt src/tests

      - name: Ruff format
        run: uv run ruff format --check src/cyt src/tests

      - name: Mypy
        run: uv run mypy -p cyt

      - name: Pytest
        run: uv run pytest src/tests

      - name: Rust tests (cyt-indexer)
        run: cargo test -p cyt-indexer

      - name: Build package
        run: uv build
