name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --all-extras --group dev --group test --locked

      - name: Verify cyt-indexer-sdk import
        run: uv run python -c "from cyt_indexer._native import build_catalog_index; assert callable(build_catalog_index)"

      - name: Ruff lint
        run: uv run ruff check src/cyt src/tests

      - name: Ruff format
        run: uv run ruff format --check src/cyt src/tests

      - name: Mypy
        run: uv run mypy -p cyt

      - name: Pytest
        run: uv run pytest src/tests

      - name: Rust tests (cyt-indexer)
        run: cargo test -p cyt-indexer

      - name: Build package
        run: uv build

  test-typescript-sdk:
    name: Test (TypeScript SDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test
