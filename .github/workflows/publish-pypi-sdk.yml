# Publish cyt-indexer-sdk to PyPI when a GitHub Release is published.
#
# One-time setup (repository maintainer):
#
# 1. PyPI — Trusted Publisher (https://pypi.org/manage/account/publishing/):
#    - PyPI project: cyt-indexer-sdk
#    - Owner: qdrddr
#    - Repository: clear-your-tools
#    - Workflow: publish-pypi-sdk.yml
#    - Environment name: pypi-sdk
#
# 2. GitHub — Environment: pypi-sdk (optional reviewers / main-only rules)
#
# 3. Create a release (tag e.g. cyt-indexer-sdk-v0.1.0) or use workflow_dispatch.

name: Publish cyt-indexer-sdk to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#cyt-indexer-sdk-v}"
          cd sdk/python
          uv version "$VERSION"

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp313-*
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BEFORE_BUILD: pip install maturin
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.13"
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch || 'AMD64' }}
        with:
          package-dir: sdk/python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch || 'default' }}
          path: wheelhouse/*.whl

  publish:
    name: Upload to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi-sdk
      url: https://pypi.org/p/cyt-indexer-sdk
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Build sdist
        run: |
          cd sdk/python
          uv build --sdist --out-dir ../../dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
