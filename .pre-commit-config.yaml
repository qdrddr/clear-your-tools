# uv run prek run --all-files
# prek run -a prettier typos committed detect-secrets add-trailing-comma uv-export uv-lock uv-sync pyupgrade markdownlint-cli2 ruff-format pytest ty-check trailing-whitespace check-yaml check-json check-toml end-of-file-fixer detect-private-key check-case-conflict check-builtin-literals check-merge-conflict check-docstring-first debug-statements  name-tests-test codespell check-filenames
fail_fast: true
default_language_version:
  python: "3.13"
repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json5]

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.1
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            "--exclude-files",
            "app/migrations/versions/.*|ast-grep/rule-tests/.*|app/tests/test_bm25_migration.py|.env.example",
          ]
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length", "140", "--ignore=E203,W503"]
        exclude: ^test_data/|bumpity.py$

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.14
    hooks:
      - id: uv-export
        args:
          [
            "--frozen",
            "--quiet",
            "--project",
            "app",
            "--output-file=requirements.txt",
          ]
        files: pyproject.toml
      - id: uv-lock
        args: ["--project", "."]
        files: pyproject.toml
      - id: uv-sync
        args: ["--project", ".", "--locked", "--all-packages"]
        files: pyproject.toml
        additional_dependencies: []

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        language_version: lts
        args: [--fix]
        exclude: ^(CLAUDE|AGENTS|GEMINI)\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      # Run the Ruff formatter.
      - id: ruff-format
        name: "Ruff formatter"
        args: [--config=pyproject.toml]
        files: '^code/.*\.(py|ipynb)$'
      # Run the Ruff linter.
      - id: ruff
        name: "Ruff linter"
        args:
          [
            --exit-non-zero-on-fix,
            --fix,
            --config=pyproject.toml,
            --output-format,
            concise,
          ]
        files: '^code/.*\.(py|ipynb)$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-builtin-literals
        args: ["--no-allow-dict-kwargs"]
        exclude: bumpity.py$
      - id: check-docstring-first
      - id: debug-statements
        exclude: bumpity.py$
      # Conflicts with ruff
      #      - id: double-quote-string-fixer
      - id: name-tests-test
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell # See pyproject.toml for args
        additional_dependencies:
          - tomli

  - repo: local
    hooks:
      - id: mypy
        name: MyPy
        entry: bash -c "source .venv/bin/activate && mypy code"
        pass_filenames: false
        language: system
        files: '^code/.*\.py$'
      - id: pytest
        name: Pytest
        entry: bash -c "source .venv/bin/activate && pytest"
        pass_filenames: false
        language: system
        files: '^code/.*\.py$'
      - id: ty-check
        name: Ty type checker
        entry: bash -c 'source .venv/bin/activate && uv run ty check code/ --project code/ --output-format concise'
        language: system
        types: [python]
        pass_filenames: false
        exclude: |
          (?x)^(
            latex/
            code/catalog/
            .ruff_cache/
            .mypy_cache/
            .venv/
            __pycache__/
            code/__pycache__/
          )
      - id: check-filenames
        name: Check for spaces in all filenames
        entry: bash
        args:
          - -c
          - |
            git ls-files \
              | grep -vE '^"?(postman/|documents/|backlog/|dirs/)' \
              | grep " " \
              && echo "Filenames should not contain spaces!" && exit 1 \
              || exit 0
        language: system
        always_run: true
        pass_filenames: false
      # Keep `suggestion` last
      - id: suggestion
        name: Suggestion
        entry: bash -c 'echo "To bypass all the pre-commit hooks, add --no-verify to git commit. To skip a specific hook, prefix the commit command with SKIP=<hook-id>."'
        language: system
        verbose: true
        pass_filenames: false
  # Insert new entries above the `suggestion` entry
