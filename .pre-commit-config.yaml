# uv run prek run --all-files
fail_fast: true
default_language_version:
  python: "3.13"
repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json5]

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.1
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            "--exclude-files",
            "app/migrations/versions/.*|ast-grep/rule-tests/.*|app/tests/test_bm25_migration.py|.env.example",
          ]
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length", "140"]
        exclude: ^test_data/|bumpity.py$

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        language_version: lts
        args: [--fix]
        exclude: ^(CLAUDE|AGENTS|GEMINI)\.md$
        
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      # Run the Ruff formatter.
      - id: ruff-format
        name: "Ruff formatter"
        args: [--config=pyproject.toml]
        files: '^code/.*\.(py|ipynb)$'
      # Run the Ruff linter.
      - id: ruff
        name: "Ruff linter"
        args: [--exit-non-zero-on-fix, --fix, --config=pyproject.toml]
        files: '^code/.*\.(py|ipynb)$'
  - repo: local
    hooks:
      - id: mypy
        name: MyPy
        entry: bash -c "source .venv/bin/activate && mypy code"
        pass_filenames: false
        language: system
        files: '^code/.*\.py$'
  - repo: local
    hooks:
      - id: pytest
        name: Pytest
        entry: bash -c "source .venv/bin/activate && pytest"
        pass_filenames: false
        language: system
        files: '^code/.*\.py$'
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.3
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-builtin-literals
        args: ["--no-allow-dict-kwargs"]
        exclude: bumpity.py$
      - id: check-docstring-first
      - id: debug-statements
        exclude: bumpity.py$
      # Conflicts with ruff
      #      - id: double-quote-string-fixer
      - id: name-tests-test
  - repo: local
    hooks:
      - id: ty-check
        name: Ty type checker
        entry: bash -c 'source .venv/bin/activate && uv run ty check code/ --project code/'
        language: system
        types: [python]
        pass_filenames: false
        exclude: |
          (?x)^(
            latex/
            code/catalog/
            .ruff_cache/
            .mypy_cache/
            .venv/
            __pycache__/
            code/__pycache__/
          )

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell # See pyproject.toml for args
        additional_dependencies:
          - tomli
