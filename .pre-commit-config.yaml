# source .venv/bin/activate && pre-commit run --all-files
fail_fast: true
default_language_version:
  python: "3.13"
repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json5]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      # Run the Ruff formatter.
      - id: ruff-format
        name: "Ruff formatter"
        args: [--config=pyproject.toml]
        files: '^code/.*\.(py|ipynb)$'
      # Run the Ruff linter.
      - id: ruff
        name: "Ruff linter"
        args: [--exit-non-zero-on-fix, --fix, --config=pyproject.toml]
        files: '^code/.*\.(py|ipynb)$'
  - repo: local
    hooks:
      - id: mypy
        name: MyPy
        entry: bash -c "source .venv/bin/activate && mypy code"
        pass_filenames: false
        language: system
        files: '^code/.*\.py$'
  - repo: local
    hooks:
      - id: pytest
        name: Pytest
        entry: bash -c "source .venv/bin/activate && pytest"
        pass_filenames: false
        language: system
        files: '^code/.*\.py$'
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.3
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
  - repo: local
    hooks:
      - id: ty-check
        name: Ty type checker
        entry: bash -c 'source .venv/bin/activate && uv run ty check code/'
        language: system
        types: [python]
        pass_filenames: false
        exclude: |
          (?x)^(
            latex/
            code/catalog/
            .ruff_cache/
            .mypy_cache/
            .venv/
            __pycache__/
            code/__pycache__/
          )

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell # See pyproject.toml for args
        additional_dependencies:
          - tomli
