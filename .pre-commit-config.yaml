# SKIP=pytest,mypy,basedpyright uv run prek run -a
# prek run -a prettier typos committed detect-secrets add-trailing-comma uv-export uv-lock uv-sync pyupgrade markdownlint-cli2 ruff-format pytest ty-check trailing-whitespace check-yaml check-json check-toml end-of-file-fixer detect-private-key check-case-conflict check-builtin-literals check-merge-conflict check-docstring-first debug-statements  name-tests-test codespell check-filenames
fail_fast: true
default_language_version:
  python: "3.13"
repos:
  # 1year old
  #  - repo: https://github.com/backplane/pre-commit-rust-hooks
  #    rev: v1.2.1
  #    hooks:
  #      - id: fmt
  #      - id: check
  #      - id: clippy
  #      - id: test
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.19.8
    hooks:
      - id: cargo-deny
        args: ["--all-features", "check"] # optionally modify the arguments for cargo-deny (default arguments shown here)
  #  - repo: https://github.com/drahnr/cargo-spellcheck
  #    rev: v0.15.7
  #    hooks:
  #      - id: cargo-spellcheck
  - repo: https://github.com/DevinR528/cargo-sort
    rev: v2.1.4
    hooks:
      - id: cargo-sort
    # 1year old
  #  - repo: https://github.com/rockmagma02/rust-pre-commit-hooks
  #    rev: v0.2.0
  #    hooks:
  #      - id: rustfmt
  #      - id: cargo-fmt
  #      - id: clippy
  # 4years old
  - repo: https://github.com/cathiele/pre-commit-rust
    rev: v0.1.0
    hooks:
      - id: cargo-audit
      - id: cargo-udeps
  #      - id: cargo-check
  #      - id: cargo-test
  # 1year old
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json5, bash, javascript, ts, tsx]
        exclude: ^\.github/workflows/.*\.ya?ml$
      - id: prettier
        name: prettier github workflow yaml
        files: ^\.github/workflows/.*\.ya?ml$
        types_or: [yaml]
        always_run: true

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.0
    hooks:
      - id: typos
        args: ["--force-exclude", "--locale", "en"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell # See pyproject.toml for args
        additional_dependencies:
          - tomli
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            "--exclude-files",
            "app/migrations/versions/.*|ast-grep/rule-tests/.*|app/tests/test_bm25_migration.py|.env.example",
          ]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length", "140", "--ignore=E203,W503"]
        exclude: ^test_data/|bumpity.py$

  - repo: local
    hooks:
      - id: sync-version
        name: sync-version
        entry: bash 'search/sync-version.sh'
        language: system
        verbose: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.17
    hooks:
      - id: uv-export
        args:
          [
            "--frozen",
            "--quiet",
            "--project",
            "app",
            "--output-file=requirements.txt",
          ]
        files: pyproject.toml
      - id: uv-lock
        args: ["--project", "."]
        files: pyproject.toml
      - id: uv-sync
        args: ["--project", ".", "--locked", "--all-packages"]
        files: pyproject.toml
        additional_dependencies: []

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        language_version: lts
        args: [--fix]
        exclude: ^(CLAUDE|AGENTS|GEMINI)\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      # Run the Ruff formatter.
      - id: ruff-format
        name: "ruff-format"
        args: [--config=pyproject.toml]
        files: '^src/.*\.(py|ipynb)$'
      # Run the Ruff linter.
      - id: ruff
        name: "ruff"
        args:
          [
            --exit-non-zero-on-fix,
            --fix,
            --config=pyproject.toml,
            --output-format,
            concise,
          ]
        files: '^src/.*\.(py|ipynb)$'
  # Should be after ruff!
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^(.ast-grep/rules/.*|\.github/workflows/.*)$
      - id: check-yaml
        name: check github workflow yaml
        files: ^\.github/workflows/.*\.ya?ml$
        always_run: true
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-builtin-literals
        args: ["--no-allow-dict-kwargs"]
        exclude: bumpity.py$
      - id: check-docstring-first
      - id: debug-statements
        exclude: bumpity.py$
      # Conflicts with ruff
      #      - id: double-quote-string-fixer
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^sdk/e2e/python/tests/(.*)\.py$

  - repo: local
    hooks:
      - id: ty-check
        name: Ty type checker
        entry: bash -c 'source .venv/bin/activate && uv run ty check src/ --project . --output-format concise'
        language: system
        types: [python]
        pass_filenames: false
        exclude: |
          (?x)^(
            latex/
            src/catalog/
            .ruff_cache/
            .mypy_cache/
            .venv/
            __pycache__/
            src/__pycache__/
          )
      - id: check-filenames
        name: Check for spaces in all filenames
        entry: bash
        args:
          - -c
          - |
            git ls-files \
              | grep -vE '^"?(postman/|documents/|backlog/|dirs/)' \
              | grep " " \
              && echo "Filenames should not contain spaces!" && exit 1 \
              || exit 0
        language: system
        always_run: true
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c "source .venv/bin/activate && cd src && mypy ."
        pass_filenames: false
        language: system
        files: '^src/.*\.py$'
      - id: pytest
        name: pytest
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run pytest'
        pass_filenames: false
        language: system
        # Run when app code or tests change (tests live under src/tests/).
        files: ^(src/.*\.py|src/tests/.*)$

  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.39.6
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: bash -c 'source .venv/bin/activate && basedpyright src sdk/python/src'
        language: system
        pass_filenames: false
        files: '^(src/.*\.py|sdk/python/.*\.py)$'

  - repo: local
    hooks:
      - id: ast-test
        name: ast-grep rule tests
        entry: bash -c 'ast-grep test --skip-snapshot-tests'
        language: system
        files: ^\.ast-grep/
        pass_filenames: false

      - id: uv-build
        name: Python package build
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv build'
        language: system
        files: ^(pyproject\.toml|src/)
        pass_filenames: false

      - id: verify-sdk
        name: Verify cyt-indexer-sdk native import
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run python -c "from cyt_indexer._native import build_catalog_index; assert callable(build_catalog_index)"'
        language: system
        files: ^(sdk/(rust|python)/|pyproject\.toml)
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (cyt-indexer)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && cargo clippy -p cyt-indexer --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W clippy::perf -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic -W clippy::todo -W clippy::unimplemented -W clippy::dbg_macro -W clippy::missing_const_for_fn -W clippy::missing_panics_doc -W clippy::missing_errors_doc -W clippy::missing_safety_doc -W clippy::wildcard_imports -W clippy::enum_glob_use -W clippy::module_name_repetitions -W clippy::pub_use -W clippy::bool_comparison -W clippy::match_bool -W clippy::match_same_arms -W clippy::match_wild_err_arm -W clippy::needless_borrow -W clippy::needless_lifetimes -W clippy::inefficient_to_string -W clippy::large_enum_variant -W clippy::large_stack_arrays -W clippy::map_clone -W unused -W dead_code'
        language: system
        files: ^(Cargo\.(toml|lock)|sdk/rust/cyt-indexer/)
        pass_filenames: false

      - id: typescript-typecheck
        name: TypeScript SDK typecheck
        entry: bash -c 'cd sdk/typescript && npx tsc --noEmit && npx tsc --noEmit -p ../e2e/typescript'
        language: system
        files: ^sdk/(typescript|e2e/typescript)/
        pass_filenames: false

      - id: typescript-test
        name: TypeScript SDK test
        entry: bash -c 'cd sdk/typescript && npm test'
        language: system
        files: ^(sdk/typescript/|sdk/rust/cyt-indexer/)
        pass_filenames: false

      - id: typescript-build
        name: TypeScript SDK build
        entry: bash -c 'cd sdk/typescript && npm run build'
        language: system
        files: ^sdk/typescript/
        pass_filenames: false

      - id: typescript-npm-audit
        name: TypeScript SDK npm audit
        entry: bash -c 'set -euo pipefail; audit_if_locked() { if [[ -f package-lock.json ]]; then npm audit --audit-level=high; fi; }; (cd sdk/typescript && audit_if_locked); (cd sdk/e2e/typescript && audit_if_locked)'
        language: system
        files: ^sdk/(typescript|e2e/typescript)/
        pass_filenames: false

      - id: typescript-sort-package-json
        name: TypeScript SDK sort-package-json
        entry: bash -c 'cd sdk/typescript && npx --yes sort-package-json package.json && cd ../e2e/typescript && npx --yes sort-package-json package.json.in'
        language: system
        files: ^sdk/(typescript/package\.json|e2e/typescript/package\.json\.in)$
        pass_filenames: false

      - id: ast-scan
        name: Ast rule scan
        entry: bash -c 'ast-grep scan src/ sdk/'
        language: system
        pass_filenames: false

      - id: typescript-ast-scan
        name: TypeScript SDK ast-scan
        entry: bash -c 'ast-grep scan sdk/typescript sdk/e2e/typescript --globs "!sdk/typescript/src/test/**"'
        language: system
        files: ^sdk/(typescript|e2e/typescript)/
        pass_filenames: false

      # Keep `suggestion` last
      - id: suggestion
        name: Suggestion
        entry: bash -c 'echo "To bypass all the pre-commit hooks, add --no-verify to git commit. To skip a specific hook, prefix the commit command with SKIP=<hook-id>."'
        language: system
        verbose: true
        pass_filenames: false
  # Insert new entries above the `suggestion` entry
