        max_tokens: 32000
        # base_url: https://api.deepinfra.com/v1
        pricing:
          input_cost_per_token: 5e-08
          output_cost_per_token: 0
          # match_litellm: "deepinfra/Qwen/Qwen3-Reranker-8B"
  bm25:
    mmap: true
    stem_language: english
    stopwords: en

pruning:
  policy:
    system_tool: prune_optional
    mcp_tool: prune_all
    minimum_tools: 50

  rerank:
    model:
      remote:
        model_nick: rerank-qwen3-8b
  # Optional per-pipeline policy overrides (terminal stage wins over pruning.policy):
  #   policy:
  #     system_tool: prune_optional_descriptions
  #     mcp_tool: prune_all_descriptions

  llm:
    model:
      remote:
        model_nick: mercury-2
  #   policy:
  #     system_tool: prune_optional_descriptions
  #     mcp_tool: prune_all_descriptions

  bm25:
    score_skills: 0.5
    index_dir: ~/.config/cyt/bm25
    score_tool: 0.3
    prune_enums: true
    score_tool_enum: 0.1
    policy:
      system_tool: prune_optional_descriptions
      mcp_tool: prune_all_descriptions

  pipeline:
    - bm25
    # - rerank
    # - llm

  per_tool: {}
  #    Agent: prune_optional
  #    mcp__hedl__hedl_convert_from: prune_optional
  #    mcp__hedl__batch: prune_all
  #    mcp__fff__multi_grep: always_include

network:
  proxy:
    reverse:
      debug_log_dir: .debug
      debug_log_max_body_bytes: 1048576
      http2:
        upstream: true # uv pip install h2
        serve: false # uv pip install 'hypercorn[h2]' + TLS below
        ssl: # openssl req -x509 -nodes -days 365 -newkey rsa:4096 -keyout ~/.config/cyt/crt/key.pem -out ~/.config/cyt/crt/cert.pem -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          keyfile: ~/.config/cyt/crt/key.pem
          certfile: ~/.config/cyt/crt/cert.pem
      port: 8834
      upstreams:
        - upstream: anthropic
          url: https://api.anthropic.com
          kind: anthropic
        - upstream: openai
          url: https://api.openai.com
          kind: openai
      endpoints:
        - anthropic
        - openai

stats:
  enabled: true
  store_full_tools: false
  database:
    path: ~/.config/cyt/stats.db

skills:
  enabled: false
  pipeline: bm25
  catalog_dir: ~/.config/cyt/skills
  cache:
    database:
      path: ~/.config/cyt/cache.db
  pageindex:
    if_add_node_id: true
    if_add_node_text: false
    bm25_cohesion:
      window_mode: sentence
      chunk_size: 2048
      token_counter: approximate
      similarity_window: 3
      threshold: 0.8
      merge_threshold: 0.7
      skip_window: 0
      min_units_per_chunk: 1
      minimum_words: 10
      minimum_sentences: 1
      min_characters_per_sentence: 24
      filter_window: 5
      filter_polyorder: 3
      filter_tolerance: 0.2
      use_stopwords: true
      include_delim: prev
      stem_language: english

    toc_check_page_num: 20
    max_page_num_each_node: 10
    max_token_num_each_node: 2000
    if_add_node_summary: true
    if_add_doc_description: false
  budget: 0.5 # Percentage of the total savings from tool pruning that can be used for skills execution (e.g. 0.5 = 50% of the total savings)
  max_tokens_per_request: 2000 # Maximum number of tokens allowed per request to the skills (e.g. 2000 = 2000 tokens)
  directories:
    - ~/.claude/skills
    - .claude/skills
    - ~/.codex/skills
    - .codex/skills
