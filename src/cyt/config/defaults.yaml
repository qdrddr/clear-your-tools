defaults:
  # inprocess: []
  # is_persistent: true
  # reranking_enabled: true
models:
  providers:
    - provider_nick: openai
      provider: openai
      domain_match: ["api.openai.com"]
      key_var_name: OPENAI_API_KEY
      # base_url: https://api.openai.com/v1
    - provider_nick: anthropic
      provider: anthropic
      key_var_name: ANTHROPIC_API_KEY
      domain_match: ["api.anthropic.com"]
      # base_url: https://api.anthropic.com
    - provider_nick: gemini
      provider: gemini
      domain_match: ["generativelanguage.googleapis.com"]
      key_var_name: GOOGLE_API_KEY
      # base_url: https://generativelanguage.googleapis.com
    - provider_nick: deepinfra
      provider: deepinfra
      domain_match: ["api.deepinfra.com"]
      key_var_name: DEEPINFRA_API_KEY
      # base_url: https://api.deepinfra.com/v1
    - provider_nick: openrouter-ai
      provider: openrouter
      key_var_name: OPENROUTER_API_KEY
      domain_match: ["openrouter.ai"]
      # base_url: https://openrouter.ai/api
  llm:
    remote:
      # Reference-only / duplicate catalog entries (enable in user config as needed):
      - name: openai/gpt-oss-120b
        provider_nick: openrouter-ai
        nick: gpt-oss-120b
        max_tokens: 128000
        pricing:
          input_cost_per_token: 1.5e-07
          output_cost_per_token: 6e-07
      - name: inception/mercury-2
        provider_nick: openrouter-ai
        nick: mercury-2
        max_tokens: 1280000
        pricing:
          input_cost_per_token: 2.5e-07
          output_cost_per_token: 7.5e-07
      - name: google/gemini-3-flash-preview
        provider_nick: openrouter-ai
        nick: gemini-3-flash
        max_tokens: 10000000
        pricing:
          input_cost_per_token: 0.5e-06
          output_cost_per_token: 3e-06
      - name: google/gemini-3.1-flash-lite
        provider_nick: openrouter-ai
        nick: gemini-3.1-flash-lite
        max_tokens: 10000000
        pricing:
          input_cost_per_token: 0.25e-06
          output_cost_per_token: 1.5e-06
      - name: claude-haiku-4-5
        provider_nick: anthropic
        nick: haiku45
        max_tokens: 200000
        pricing:
          input_cost_per_token: 1e-06
          output_cost_per_token: 5e-06
      - name: claude-opus-4-7
        provider_nick: anthropic
        nick: opus47
        max_tokens: 1000000
        pricing:
          input_cost_per_token: 5e-06
          output_cost_per_token: 25e-06
      - name: claude-opus-4-8
        provider_nick: anthropic
        nick: opus48
        max_tokens: 1000000
        pricing:
          input_cost_per_token: 5e-06
          output_cost_per_token: 25e-06
      - name: claude-sonnet-4-6
        provider_nick: anthropic
        nick: sonnet46
        max_tokens: 1000000
        pricing:
          input_cost_per_token: 3e-06
          output_cost_per_token: 15e-06
      - name: claude-sonnet-5
        provider_nick: anthropic
        nick: sonnet46
        max_tokens: 1000000
        pricing:
          input_cost_per_token: 3e-06
          output_cost_per_token: 15e-06
      - name: claude-sonnet-5
        nick: openrouter-ai-claude-sonnet-5
        provider_nick: openrouter-ai
        pricing:
          input_cost_per_token: 3.0e-06
          output_cost_per_token: 1.5e-05
      - name: gpt-5.4-nano
        provider_nick: openai
        nick: gpt-5.4-nano
        max_tokens: 400000
        responses_api: false
        pricing:
          input_cost_per_token: 0.2e-06
          output_cost_per_token: 1.25e-06
      - name: gpt-5.4-mini
        provider_nick: openai
        nick: gpt-5.4-mini
        max_tokens: 400000
        responses_api: false
        pricing:
          input_cost_per_token: 0.75e-06
          output_cost_per_token: 4.5e-06
      - name: gpt-5.5
        provider_nick: openai
        nick: gpt-5.5
        max_tokens: 1000000
        responses_api: false
        pricing:
          input_cost_per_token: 5e-06
          output_cost_per_token: 30e-06
      - name: gpt-5.5-pro
        provider_nick: openai
        nick: gpt-5.5-pro
        max_tokens: 1000000
        responses_api: false
        pricing:
          input_cost_per_token: 30e-06
          output_cost_per_token: 180e-06
  rerankers:
    remote:
      - name: Qwen/Qwen3-Reranker-8B
        provider_nick: deepinfra
        nick: rerank-qwen3-8b
        max_tokens: 32000
        pricing:
          input_cost_per_token: 5e-08
          output_cost_per_token: 0
  bm25:
    mmap: true
    stem_language: english
    stopwords: en

pruning:
  inject_via: proxy # hook | proxy — applies to skills and tools injection
  inject_into_user_message: true # proxy only: inject pruned MCP tools + skills into latest user turn
  tools:
    hook:
      tools_from: client # client | definitions
      mcp_client_file: ~/.config/cyt/mcp.json
      mcp_definitions_file: ~/.config/cyt/mcp-definitions.json
    policy:
      system_tool: prune_optional
      mcp_tool: prune_all
      minimum_tools: 50
      per_tool: {}
    sequence:
      - bm25
      # - rerank
      # - llm
    pipelines:
      bm25:
        score_skills: 0.5
        index_dir: ~/.config/cyt/bm25
        score_tool: 0.3
        prune_enums: true
        score_tool_enum: 0.1
        policy:
          system_tool: prune_optional_descriptions
          mcp_tool: prune_all_descriptions
      rerank:
        model_nick: rerank-qwen3-8b
        score_skills: 0.003
        # policy:
        #   system_tool: prune_optional_descriptions
        #   mcp_tool: prune_all_descriptions
      llm:
        model_nick: mercury-2
        # policy:
        #   system_tool: prune_optional_descriptions
        #   mcp_tool: prune_all_descriptions

network:
  proxy:
    reverse:
      debug_log_dir: .debug
      debug_log_max_body_bytes: 1048576
      http2:
        upstream: true # uv pip install h2
        serve: false # uv pip install 'hypercorn[h2]' + TLS below
        ssl: # openssl req -x509 -nodes -days 365 -newkey rsa:4096 -keyout ~/.config/cyt/crt/key.pem -out ~/.config/cyt/crt/cert.pem -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          keyfile: ~/.config/cyt/crt/key.pem
          certfile: ~/.config/cyt/crt/cert.pem
      port: 8834
      upstreams:
        - endpoint: anthropic
          url: https://api.anthropic.com
          kind: anthropic
        - endpoint: openai
          url: https://api.openai.com
          kind: openai
        - endpoint: openrouter
          kind: openrouter
          url: https://openrouter.ai/api
          provider_nick: openrouter-ai
      endpoints:
        - anthropic
        - openai

cache:
  enabled: true
  bm25_dir: ~/.config/cyt/bm25
  skills_dir: ~/.config/cyt/skills
  tools_dir: ~/.config/cyt/tools
  memory:
    lazy_registry: false
    async_disk_writes: true
    lru:
      chunk_bodies: 512
      merged_documents: 128
      skills_index: 64
      tantivy_indexes: 32
      tool_catalogs: 128

stats:
  enabled: true
  store_full_tools: false
  rollup_on_query: true
  backup_before_rollup: true
  database:
    path: ~/.config/cyt/stats.db

skills:
  enabled: true
  frontmatter_upper_limit: 0.45
  pipeline: bm25 # or llm or rerank (node-based; bm25 uses BM25 chunk search)
  catalog_dir: ~/.config/cyt/skills
  # pageindex:
  #   if_add_node_id: true
  #   if_add_node_text: false
  #   bm25_cohesion:
  #     window_mode: sentence
  #     chunk_size: 2048
  #     token_counter: approximate
  #     similarity_window: 3
  #     threshold: 0.8
  #     merge_threshold: 0.7
  #     skip_window: 0
  #     min_units_per_chunk: 1
  #     minimum_words: 10
  #     minimum_sentences: 1
  #     min_characters_per_sentence: 24
  #     filter_window: 5
  #     filter_polyorder: 3
  #     filter_tolerance: 0.2
  #     use_stopwords: true
  #     include_delim: prev
  #     stem_language: english
  #   toc_check_page_num: 20
  #   max_page_num_each_node: 10
  #   max_token_num_each_node: 2000
  #   if_add_node_summary: true
  #   if_add_doc_description: false
  max_tokens_per_request: 20000
  bm25_node_fallback_threshold: 15

  hook:
    request_budget_fraction: 30.0
    inject_cap_multiplier_of_request_tokens: 25.0

  proxy:
    request_budget_fraction: 0.02
    inject_cap_fraction_of_savings: 0.5
    savings_budget_fraction: 0.1
    savings_rate_threshold: 0.20
  directories:
    - ~/.claude/skills
    - .claude/skills
    - ~/.codex/skills
    - .codex/skills

launch:
  claude:
    endpoint: null
    models:
      opus: ""
      sonnet: ""
      haiku: ""
      subagent: ""
  codex:
    endpoint: null
    env_key: CODEX_OPENAI_API_KEY
