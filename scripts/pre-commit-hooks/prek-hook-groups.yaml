# Language groups for scripts/pre-commit-hooks/prek-loop.sh
#
# Hooks may appear in more than one group. The `suggestion` hook is omitted
# intentionally (informational only).
#
# Usage:
#   ./scripts/pre-commit-hooks/prek-loop.sh -g py
#   ./scripts/pre-commit-hooks/prek-loop.sh --group py ts
#   ./scripts/pre-commit-hooks/prek-loop.sh -g release   # pre-publish simulate-registry only
#
groups:
  py:
    - add-trailing-comma
    - basedpyright
    - check-builtin-literals
    - check-docstring-first
    - debug-statements
    - flake8
    - local-dev-app
    - local-dev-sdk-python
    - mypy
    - name-tests-test
    - python-check-blanket-noqa
    - python-check-blanket-type-ignore
    - python-check-mock-methods
    - pyupgrade
    - pytest-unit
    - pytest-gherkin-unit
    - pytest-quality-metrics
    - pytest-coverage
    - pytest-mutation
    - pytest-qa
    - pytest-sdk-python
    - ruff
    - ruff-format
    - ty-check
    - uv-build
    - export-requirements
    - verify-pins
    - uv-lock
    - uv-sync
    - verify-sdk

  rust:
    - build-c-lib-for-go
    - cargo-audit
    - cargo-build-sdk-release
    - cargo-clippy
    - cargo-deny
    - cargo-fmt
    - cargo-test-coverage
    - cargo-test-cucumber
    - cargo-test-ffi
    - cargo-test-integration
    - cargo-test-mutation
    - cargo-test-qa
    - cargo-test-quality-metrics
    - cargo-test-unit
    - cargo-sort
    - cargo-udeps
    - cbindgen-header-drift
    - c-header-sync
    - local-dev-core-rust
    - verify-sdk

  go:
    - build-c-lib-for-go
    - go-build-repo-mod
    - go-critic
    - go-fumpt
    - go-imports
    - go-mod-tidy-repo
    - go-sec-repo-mod
    - go-staticcheck-repo-mod
    - go-test-repo-mod
    - local-dev-sdk-go

  c:
    - build-c-lib-for-go
    - cargo-test-ffi
    - c-header-sync
    - cbindgen-header-drift
    - clang-format
    - clang-tidy
    - cmake-compile-db
    - cppcheck
    - cpplint
    - local-dev-sdk-c

  ts:
    - all-fallow
    - local-dev-sdk-typescript
    - typescript-ast-scan
    - typescript-build
    - typescript-npm-audit
    - typescript-sort-package-json
    - typescript-test-unit
    - typescript-test-parity
    - typescript-typecheck

  uni:
    - actionlint
    - ast-scan
    - ast-test
    - check-added-large-files
    - check-case-conflict
    - check-filenames
    - check-github-workflows
    - check-json
    - check-jsonschema
    - check-merge-conflict
    - check-symlinks
    - check-toml
    - check-yaml
    - codespell
    - committed
    - detect-private-key
    - detect-secrets
    - end-of-file-fixer
    - gitleaks
    - markdownlint-cli2
    - mixed-line-ending
    - oxipng
    - prettier
    - shellcheck
    - shfmt
    - heal-cargo-lock
    - sync-version
    - talisman-commit
    - trailing-whitespace
    - trufflehog
    - typos
    - verify-pins
    - psscriptanalyzer-check
    - psscriptanalyzer-format

  release:
    - cargo-build-sdk-release
    - simulate-registry
    - verify-pins
