# Language groups for scripts/pre-commit-hooks/prek-loop.sh
#
# Automated pytest hooks run unit/gherkin/quality/coverage/mutation/qa categories only.
# Integration tests (src/tests/integration) are manual-only:
#   uv run pytest -m integration --run-integration
# prek-loop.sh unsets CYT_RUN_INTEGRATION_TESTS; do not add integration pytest hooks here.
# MCP restore/uninstall unit tests use autouse isolation in src/tests/conftest.py
# (_isolate_agent_hook_paths + _isolate_cyt_mcp_user_config) so pre-commit never
# touches ~/.cursor/mcp.json, ~/.config/cyt/mcp/, or workspace .agents/cyt/config/mcp/.
#
# Hooks may appear in more than one group. The `suggestion` hook is omitted
# intentionally (informational only).
#
# Python subgroups (parallel-friendly):
#   py-sync              — deps/native setup (run first, serial)
#   py-lint              — formatters, linters, type checkers
#   py-test-unit-shard-* — pytest unit shards (parallel; use prek-loop-py-parallel.sh)
#   py-test-gherkin      — pytest gherkin unit (parallel)
#   py-test-core         — pytest unit + gherkin (serial backward compat)
#   py-test-heavy        — quality, coverage, mutation, qa
#   py-test-sdk          — sdk/python pytest
#   py-build             — wheel build (run last, serial)
#   py-dev               — fast dev iteration subset
#   py                   — full pre-push gate (ordered union, no duplicates)
#   py-smoke             — optional end-to-end workflow.sh smoke (local-dev-*)
#
# Usage:
#   ./scripts/pre-commit-hooks/prek-loop.sh -g py
#   ./scripts/pre-commit-hooks/prek-loop.sh --group py ts
#   ./scripts/pre-commit-hooks/prek-loop.sh -g release   # pre-publish simulate-registry only
#
# Fast iteration (single terminal, changed files only):
#   ./scripts/pre-commit-hooks/prek-loop.sh --short --one-run --changed-only --fail-fast -g py-dev
#
# Parallel full Python check (recommended):
#   ./scripts/pre-commit-hooks/prek-loop-py-parallel.sh --short --one-run
#   PREK_PYTEST_UNIT_SHARDS=6 ./scripts/pre-commit-hooks/prek-loop-py-parallel.sh --short --one-run --xdist
#
# Manual parallel (separate terminals):
#   ./scripts/pre-commit-hooks/prek-loop.sh --short --one-run -g py-test-unit-shard-0
#   ./scripts/pre-commit-hooks/prek-loop.sh --short --one-run -g py-test-gherkin
#
# Pre-push gate (same coverage, no duplicate local-dev-* hooks):
#   ./scripts/pre-commit-hooks/prek-loop.sh --short --one-run -g py
#
# Parallel (separate terminals): -g py-lint, -g py-test-unit-shard-*, -g py-test-gherkin, -g rust, -g uni may run simultaneously.
#
groups:
  py-sync:
    - uv-lock
    - uv-sync
    - export-requirements
    - verify-pins
    - maturin-develop
    - verify-sdk
    - verify-app-python

  py-lint:
